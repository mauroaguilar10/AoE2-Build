# Persas · Arena · 1v1 — T44. Aprobada por el mantenedor.
# Plan: Fast Castle con boom de centros urbanos → castillo y elefantes de guerra con ballesteros sin oro
#       (Kamandaran), húsares y fundíbulos.
#   Arena es el peor mapa persa según aoebuddy (46,6 % de victorias). No hay plan publicado de Persas para Arena.
#   Se combinan: aoe2guide.com (en mapas cerrados, elefantes de guerra en masa detrás de arqueros baratos y
#   húsares, con asedio), Cicero "27+2 FC Boom" (genérico, pensado para mapas cerrados) y aoe2-guide (Arena:
#   3-4 centros urbanos, monasterio, carrera por las reliquias; fundíbulos para las murallas).
# Mecánicas verificadas contra los datos del parche 188329: +50 de madera y comida al empezar; centros urbanos
# con el doble de PV y +15 % de velocidad en Castillos; Kamandaran (Castillos: los arqueros cuestan madera en vez
# de oro); Elefante de guerra de élite, Ballestero y Húsar disponibles; sin Arbalestero ni Paladín.
# Notas de revisión:
#  - Feudal 27 y Castillos 29 (con la caballería de exploración inicial) y repartos (14/9/3 y 11/14/3): los que da
#    Cicero para "27+2 FC Boom".
#  - Castillo, momento del ataque y orden de mejoras: criterio propio.
civ: Persians
map: arena
role: 1v1
sources:
  - title: "aoe2guide.com — Persians: en mapas cerrados, elefantes de guerra detrás de arqueros baratos y húsares"
    url: "https://aoe2guide.com/en/civs/persians/"
  - title: "Build Order Reference (Cicero) — 27+2 FC Boom: Fast Castle para mapas cerrados"
    url: "https://johsaoe2debuildorderreference.site44.com/27+2-fc-boom.html"
  - title: "aoe2-guide — Arena (3-4 centros urbanos, monasterio, reliquias; fundíbulos para las murallas)"
    url: "https://aoe2-guide.pages.dev/en/maps/arena"
  - title: "aoebuddy — Persians: estadísticas por mapa y parches recientes"
    url: "https://aoebuddy.com/civs/persians"
economy:
  opening:
    es: "Fast Castle y boom; castillo con unidades de [[unit:239]] y unidades de [[unit:24]] con [[tech:488]]"
    en: "Fast Castle and boom; a castle with [[unit:239]] units and [[unit:24]] units with [[tech:488]]"
  ageUpPop:
    feudal: 27
    castle: 29
  villagers:
    feudal: { food: 14, wood: 9, gold: 3, stone: 0 }
    castle: { food: 11, wood: 14, gold: 3, stone: 0 }
  buildOrder:
    - pop: 6
      text:
        es: "Aldeanos 1-6 a las ovejas (los Persas empiezan con 50 de madera y 50 de comida más); la [[unit:448]] busca los jabalíes y las reliquias"
        en: "Villagers 1-6 to sheep (Persians start with 50 extra wood and food); the [[unit:448]] finds the boars and the relics"
    - pop: 10
      text:
        es: "Aldeanos 7-10 a la madera con el campamento maderero. Cierra pronto las puertas de la muralla"
        en: "Villagers 7-10 to wood with the lumber camp. Close the wall gates early"
    - pop: 11
      text:
        es: "Aldeano 11: atrae el primer jabalí"
        en: "Villager 11: lure the first boar"
    - pop: 16
      text:
        es: "Aldeanos 12-16 a las bayas con el molino"
        en: "Villagers 12-16 to berries with the mill"
    - pop: 18
      text:
        es: "Aldeanos 17-18 al segundo jabalí y después a granjas"
        en: "Villagers 17-18 to the second boar, then farms"
    - pop: 23
      text:
        es: "Aldeanos 19-23 a la madera con un segundo campamento maderero"
        en: "Villagers 19-23 to wood with a second lumber camp"
    - pop: 27
      text:
        es: "Aldeanos 24-26 al oro. Telar y sube a Feudal"
        en: "Villagers 24-26 to gold. Loom and click up to Feudal"
    - pop: 29
      text:
        es: "En Feudal: mercado y herrería; los 2 aldeanos nuevos y 3 de comida, a la madera. Sube a Castillos"
        en: "In Feudal: market and blacksmith; the 2 new villagers and 3 from food go to wood. Click up to Castle Age"
    - pop: 29
      text:
        es: "Al llegar a Castillos: dos centros urbanos más (los persas tienen el doble de PV y trabajan un 15 % más rápido), [[tech:203]], unas 18 granjas, [[tech:213]] y un cuarto centro urbano. Después, monasterio para las reliquias y aldeanos a la piedra para un castillo"
        en: "On reaching Castle Age: two more town centers (Persian ones have double HP and work 15% faster), [[tech:203]], about 18 farms, [[tech:213]] and a fourth town center. Then a monastery for the relics and villagers to stone for a castle"
attack:
  when:
    es: "Hacia el final de Castillos o en Imperial: unidades de [[unit:239]] delante, unidades de [[unit:24]] detrás (con [[tech:488]] no cuestan oro) y 2-3 de [[unit:331]] para abrir la muralla"
    en: "Late Castle Age or Imperial Age: [[unit:239]] units in front, [[unit:24]] units behind (no gold cost with [[tech:488]]) and 2-3 [[unit:331]] units to open the wall"
  core: [unit:239]
  support: [unit:24, unit:331]
  transition:
    units: [unit:558, unit:441]
    note:
      es: "En Imperial: mejora a [[unit:558]] y suma unidades de [[unit:441]] contra unidades de [[unit:125]] y el asedio"
      en: "In Imperial Age: upgrade to [[unit:558]] and add [[unit:441]] units against [[unit:125]] units and siege"
  upgrades: [tech:488, tech:435, tech:81]
