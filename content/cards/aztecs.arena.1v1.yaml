# Aztecas · Arena · 1v1 — T39. Aprobada por el mantenedor.
# Plan: Fast Castle con monasterio → monjes con arietes y mangoneles, y todas las reliquias; en Imperial,
#       campeones con Guerras floridas y guerrilleros de élite con Átlatl (Fox AOE, "Monks, Siege, Relics").
# Mecánicas verificadas contra los datos del parche 188329: aldeanos cargan +3, monjes +5 PR por tecnología
# del monasterio, bonificación de equipo +33 % de oro por reliquia; Átlatl (Castillos), Guerras floridas
# (Imperial), Campeón, Guerrillero de élite y Onagro disponibles.
# Notas de revisión:
#  - Población de Feudal (22) y reparto (14/6/2): sumando los pasos de Fox AOE.
#  - Población (28) y reparto en Castillos (14/9/5): aproximados, como en Mongoles · Arena; Fox AOE no los da.
#  - Tamaño del empuje (6-8 monjes, 2-3 arietes): criterio propio.
