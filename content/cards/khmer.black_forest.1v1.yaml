# Jemeres · Selva Negra · 1v1 — T42. Aprobada por el mantenedor.
# Plan: amurallar, Fast Castle sin edificios previos y boom de centros urbanos → en Imperial, bola de elefantes
#       con balista, escorpiones pesados y fundíbulos.
#   No hay plan publicado de Jemeres para Selva Negra. Se combinan: Cicero "27+2 FC Boom" (genérico, "pensado
#   para mapas cerrados"), aoe2guide.com (Jemeres en mapas cerrados: escorpiones pesados, elefantes con balista y
#   fundíbulos), Sitaux (doble empalizada sin puerta después de los dos jabalíes) y aoe2-guide (Selva Negra:
#   murallas de piedra a mitad de partida, boom e Imperial hacia el minuto 30-32; los fundíbulos encabezan el ataque).
# Mecánicas verificadas contra los datos del parche 188329: no necesitan edificios para avanzar de edad;
# granjeros sin molino ni centro urbano; aldeanos refugiados en las casas; Ballestas dobles (Imperial);
# escorpiones +1 de alcance (equipo); sin Onagro de asedio ni Cañón de asedio.
# Notas de revisión:
#  - Feudal 27 y Castillos 29 (con la caballería de exploración inicial) y repartos (14/9/3 y 11/14/3): los que
#    da Cicero para "27+2 FC Boom".
#  - Subir a Castillos sin mercado ni herrería (el build genérico los construye): adaptación por la bonificación jemer.
#  - Momento y tamaño del ataque y orden de mejoras: criterio propio.
civ: Khmer
map: black_forest
role: 1v1
sources:
  - title: "Build Order Reference (Cicero) — 27+2 FC Boom: Fast Castle para mapas cerrados"
    url: "https://johsaoe2debuildorderreference.site44.com/27+2-fc-boom.html"
  - title: "aoe2guide.com — Khmer: en mapas cerrados, escorpiones pesados, elefantes con balista y fundíbulos"
    url: "https://aoe2guide.com/en/civs/khmer/"
  - title: "Sitaux — Black Forest (amurallar después de los jabalíes con doble empalizada, sin puerta)"
    url: "https://sitaux.com/black-forest/"
  - title: "aoe2-guide — Black Forest (murallas de piedra, boom, Imperial hacia el minuto 30-32, fundíbulos)"
    url: "https://aoe2-guide.pages.dev/en/maps/black-forest"
economy:
  opening:
    es: "Amurallar, Fast Castle y boom; en Imperial, unidades de [[unit:1122]] y de [[unit:542]] con fundíbulos"
    en: "Wall in, Fast Castle and boom; Imperial Age [[unit:1122]] and [[unit:542]] units with trebuchets"
