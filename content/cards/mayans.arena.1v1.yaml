# Mayas · Arena · 1v1 — T37. Aprobada por el mantenedor.
# Plan: "Plume & Boom": Fast Castle, castillo y segundo centro urbano al llegar a Castillos, tercer centro
#       urbano un minuto después y arqueros emplumados sin parar; ataque con arqueros emplumados y arietes.
#   aoe2.guide, "Mayan Plume-&-Boom" (21/08/2020): pasos y poblaciones (Feudal 27, Castillos 29).
#   Arena: mapa cerrado con murallas de piedra; lo más habitual es el Fast Castle (Liquipedia, aoevolve).
# Mecánicas verificadas contra los datos del parche 188329: +1 aldeano y -50 de comida al empezar;
# Arquero emplumado (55 de madera y 55 de oro) disponible; Dactilera disponible.
# Notas de revisión:
#  - La guía es de 2020 y no da aldeanos por paso: repartos (Feudal 14/8/2/2, Castillos 12/8/2/6) derivados
#    de sus pasos, aproximados.
#  - Ataque con 10-12 arqueros emplumados y 2 arietes y orden de mejoras: criterio propio.
civ: Mayans
map: arena
role: 1v1
sources:
  - title: "aoe2.guide — Mayan Plume-&-Boom (21/08/2020): Fast Castle, castillo y centros urbanos al llegar a Castillos"
    url: "https://aoe2.guide/mayan-plume-boom/"
  - title: "Liquipedia — Arena (mapa cerrado con murallas de piedra; el Fast Castle es la estrategia más frecuente)"
    url: "https://liquipedia.net/ageofempires/Arena"
economy:
  opening:
    es: "Fast Castle con castillo y boom de centros urbanos; arqueros emplumados sin parar"
    en: "Fast Castle with a castle and a town center boom; non-stop plumed archers"
  ageUpPop:
    feudal: 27
    castle: 29
  villagers:
    feudal: { food: 14, wood: 8, gold: 2, stone: 2 }
    castle: { food: 12, wood: 8, gold: 2, stone: 6 }
  buildOrder:
    - pop: 6
      text:
        es: "Los Mayas empiezan con un aldeano más y 50 de comida menos: Telar, dos casas y los primeros aldeanos a las ovejas"
        en: "Mayans start with one extra villager and 50 less food: Loom, two houses and the first villagers to sheep"
    - pop: 10
      text:
        es: "Cuatro aldeanos a la madera con el campamento maderero"
        en: "Four villagers to wood with the lumber camp"
    - pop: 11
      text:
        es: "Un aldeano atrae el primer jabalí (con una casa por el camino)"
        en: "One villager lures the first boar (building a house on the way)"
    - pop: 16
      text:
        es: "Cuatro aldeanos a las bayas con el molino; uno atrae el segundo jabalí"
        en: "Four villagers to berries with the mill; one lures the second boar"
    - pop: 20
      text:
        es: "Cuatro aldeanos a la madera con un segundo campamento"
        en: "Four villagers to wood with a second lumber camp"
    - pop: 27
      text:
        es: "Dos aldeanos al oro (uno construye una casa y el campamento minero) y dos a la piedra con su campamento. Sube a Feudal"
        en: "Two villagers to gold (one builds a house and the mining camp) and two to stone with its camp. Click up to Feudal"
    - pop: 29
      text:
        es: "En Feudal: los dos del jabalí, a la piedra; las ovejas, a granjas; herrería y mercado; dos aldeanos nuevos a la piedra. Sube a Castillos"
        en: "In Feudal: the two boar villagers go to stone; sheep villagers to farms; blacksmith and market; two new villagers to stone. Click up to Castle Age"
    - pop: 29
      text:
        es: "Mientras sube: Emplumado de flechas, Hacha de doble filo y Collera"
        en: "While advancing: Fletching, Double-Bit Axe and Horse Collar"
    - pop: 29
      text:
        es: "Al llegar a Castillos: los de la piedra construyen un castillo; los de un campamento maderero, un segundo centro urbano. Unidades de [[unit:763]] sin parar"
        en: "On reaching Castle Age: the stone villagers build a castle; one lumber camp's villagers build a second town center. Non-stop [[unit:763]] units"
    - pop: 35
      text:
        es: "Un minuto después, tercer centro urbano; Sierra de arco y Flecha de punzón; aldeanos nuevos al oro y a la madera"
        en: "A minute later, a third town center; Bow Saw and Bodkin Arrow; new villagers to gold and wood"
attack:
  when:
    es: "En Castillos, con 10-12 unidades de [[unit:763]] y 2 de [[unit:1258]]: los arietes rompen la puerta y los arqueros emplumados, rápidos y resistentes, cubren desde atrás"
    en: "In Castle Age, with 10-12 [[unit:763]] units and 2 [[unit:1258]] units: the rams break the gate while the fast, sturdy plumed archers cover from behind"
  core: [unit:763]
  support: [unit:1258]
  transition:
    units: [unit:765, unit:331]
    note:
      es: "En Imperial, mejora a [[unit:765]] y suma trebuchets para derribar murallas y castillos"
      en: "In Imperial Age, upgrade to [[unit:765]] and add trebuchets to bring down walls and castles"
  upgrades: [tech:200, tech:437, tech:211]
