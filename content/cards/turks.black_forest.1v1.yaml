# Turcos · Selva Negra · 1v1 — T41. Aprobada por el mantenedor.
# Plan: amurallar y Fast Imperial → artilleros manuales y cañones de asedio que rompen la muralla; después,
#       arqueros de caballería pesada y húsares.
#   Selva Negra es de los mejores mapas turcos (el primero según aoe2-guide, 58,8 % de victorias), pero no hay
#   plan publicado de Turcos para este mapa. Se combinan: el Fast Imperial de Cicero (el plan propio de los
#   Turcos en mapas cerrados), aoe2guide.com (estilo en mapas cerrados), Sitaux (amurallar después de los dos
#   jabalíes) y aoe2-guide (Selva Negra: empalizada primero y murallas de piedra después).
# Mecánicas verificadas contra los datos del parche 188329: mineros de oro +25 %, Química gratis, unidades de
# pólvora +25 % de PV, Artillería (Imperial: cañones +2 de alcance), Cipayos (Castillos), murallas de piedra
# disponibles; sin Onagro (no pueden talar el bosque).
# Notas de revisión:
#  - Poblaciones (29 / 31) y repartos: los de Cicero, como en Turcos · Arena.
#  - Usar el Fast Imperial en Selva Negra (en vez del boom con Fast Castle que propone el subagente como
#    genérico) y el momento del ataque: criterio propio.
civ: Turks
map: black_forest
role: 1v1
sources:
  - title: "Build Order Reference (Cicero) — Turks 29+2+2 FI: pasos, poblaciones y repartos"
    url: "https://johsaoe2debuildorderreference.site44.com/29+2+2-fi-TURKS.html"
  - title: "aoe2guide.com — Turks: en mapas cerrados, arqueros de caballería pesada, húsares y cañones"
    url: "https://aoe2guide.com/en/civs/turks/"
  - title: "Sitaux — Black Forest (amurallar después de los jabalíes con doble empalizada, sin puerta)"
    url: "https://sitaux.com/black-forest/"
  - title: "aoe2-guide — Black Forest (empalizada primero y murallas de piedra después; los Turcos, primera civilización del mapa)"
    url: "https://aoe2-guide.pages.dev/en/maps/black-forest"
economy:
  opening:
    es: "Amurallar y Fast Imperial con unidades de [[unit:5]] y de [[unit:36]]"
    en: "Wall in, then Fast Imperial into [[unit:5]] and [[unit:36]] units"
  ageUpPop:
    feudal: 29
    castle: 31
  villagers:
    feudal: { food: 15, wood: 8, gold: 5, stone: 0 }
    castle: { food: 15, wood: 8, gold: 7, stone: 0 }
  buildOrder:
    - pop: 6
      text:
        es: "Aldeanos 1-6 a las ovejas; la [[unit:448]] busca los jabalíes, los ciervos y las reliquias"
        en: "Villagers 1-6 to sheep; the [[unit:448]] finds the boars, the deer and the relics"
    - pop: 10
      text:
        es: "Aldeanos 7-10 a la madera con el campamento maderero"
        en: "Villagers 7-10 to wood with the lumber camp"
    - pop: 11
      text:
        es: "Aldeano 11: atrae el primer jabalí"
        en: "Villager 11: lure the first boar"
    - pop: 15
      text:
        es: "Aldeanos 12-15 a las bayas con el molino"
        en: "Villagers 12-15 to berries with the mill"
    - pop: 19
      text:
        es: "Aldeanos 16-19 a la madera con un segundo campamento maderero"
        en: "Villagers 16-19 to wood with a second lumber camp"
    - pop: 23
      text:
        es: "Aldeanos 20-23 al segundo jabalí, las ovejas y los ciervos; después, granjas. Ya con los dos jabalíes: dos aldeanos de madera cierran la abertura con doble empalizada, sin puerta"
        en: "Villagers 20-23 to the second boar, sheep and deer; then farms. Once both boars are in: two wood villagers close the gap with a double palisade, no gate"
    - pop: 29
      text:
        es: "Aldeanos 24-28 al oro (los mineros turcos trabajan un 25 % más rápido). Telar y sube a Feudal"
        en: "Villagers 24-28 to gold (Turkish miners work 25% faster). Loom and click up to Feudal"
    - pop: 31
      text:
        es: "En Feudal: granjas, mercado y herrería; 2 aldeanos más al oro. Sube a Castillos"
        en: "In Feudal: farms, market and blacksmith; 2 more villagers to gold. Click up to Castle Age"
    - pop: 33
      text:
        es: "En Castillos: [[tech:202]] y [[tech:55]]; 3 aldeanos más al oro y 4 a la madera. Taller de asedio y monasterio; 2 aldeanos más al oro y sube a Imperial. Cambia la empalizada por muralla de piedra"
        en: "In Castle Age: [[tech:202]] and [[tech:55]]; 3 more villagers to gold and 4 to wood. Siege workshop and monastery; 2 more villagers to gold, then click up to Imperial Age. Replace the palisade with a stone wall"
    - pop: 33
      text:
        es: "Al llegar a Imperial: dos galerías de tiro con arco con unidades de [[unit:5]] ([[tech:47]] es gratis para los Turcos) y unidades de [[unit:36]] desde el taller de asedio"
        en: "On reaching Imperial Age: two archery ranges with [[unit:5]] units ([[tech:47]] is free for Turks) and [[unit:36]] units from the siege workshop"
attack:
  when:
    es: "En Imperial, con [[tech:10]], unas 10 unidades de [[unit:5]] y 2-3 de [[unit:36]]: entra por su abertura; los cañones rompen la muralla y las torres desde lejos mientras las unidades de [[unit:5]] los protegen"
    en: "In Imperial Age, with [[tech:10]], about 10 [[unit:5]] units and 2-3 [[unit:36]] units: push through their gap; the cannons break the wall and towers from range while the [[unit:5]] units protect them"
  core: [unit:5]
  support: [unit:36]
  transition:
    units: [unit:474, unit:441]
    note:
      es: "Después, unidades de [[unit:474]] con [[tech:491]] y de [[unit:441]] (mejora gratis para los Turcos) junto a los cañones"
      en: "Later, [[unit:474]] units with [[tech:491]] and [[unit:441]] units (a free upgrade for Turks) alongside the cannons"
  upgrades: [tech:10, tech:211, tech:212]
