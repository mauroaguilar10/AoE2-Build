# Turcos · Arena · 1v1 — T41. Aprobada por el mantenedor.
# Plan: Fast Imperial → artilleros manuales y cañones de asedio, con monasterio para curar y las reliquias.
#   Arena es de los mejores mapas turcos (el primero según aoe2-guide, 58,8 % de victorias).
#   Cicero, "Turks 29+2+2 FI": pasos, poblaciones (29 / 31 / 33) y repartos al subir.
#   aoebuddy (Morley) y aoe2-guide (Hera), Fast Imperial de Turcos: artilleros manuales en masa con 1-2 cañones,
#   monasterio para curar y 1-2 reliquias, caballería ligera para cazar el asedio enemigo.
# Mecánicas verificadas contra los datos del parche 188329: mineros de oro +25 %, Química gratis y tecnologías de
# pólvora -50 %, unidades de pólvora +25 % de PV, mejoras de la línea de caballería de exploración gratis,
# Artillería (Imperial: cañones +2 de alcance), Cipayos (Castillos); sin Onagro ni Ingenieros de asedio.
# Notas de revisión:
#  - Repartos de Feudal (15/8/5) y Castillos (15/8/7): los que da Cicero; la población incluye la caballería de
#    exploración inicial.
#  - Paso a arqueros de caballería pesada con húsares: aoe2guide.com (estilo de los Turcos en mapas cerrados).
#  - Orden de mejoras: criterio propio.
civ: Turks
map: arena
role: 1v1
