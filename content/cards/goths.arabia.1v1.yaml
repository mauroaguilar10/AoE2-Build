# Godos · Arabia · 1v1 — T40. Aprobada por el mantenedor.
# Plan: hombres de armas en Feudal → arqueros desde una galería → en Castillos, castillo y Anarquía para
#       entrenar huscarles en los cuarteles, con ballesteros detrás.
#   No hay guía publicada con planes de Godos por mapa (Fox AOE no tiene guía de Godos). Se combinan:
#   Cicero, "22 pop Man-at-Arms into Archers" (build genérico: pasos, población y reparto) y los consejos de
#   la civilización de aoe2guide.com y aoedb.net (abrir con hombres de armas; huscarles contra arqueros).
# Mecánicas verificadas contra los datos del parche 188329: Telar instantáneo, cazadores +15 de carga,
# infantería -15/20/25/30 % por edad, +1/+2/+3 de ataque de la infantería contra edificios, Anarquía (Castillos),
# Huscarle; sin Arbalestero ni Dactilera. Las estadísticas del Huscarle no están en los datos: la ficha no da números.
# Notas de revisión:
#  - Feudal 22 (los hombres de armas se entrenan mientras sube, no cuentan) y reparto (13/7/2): sumando los
#    pasos de Cicero; los 2 aldeanos que no asigna (constructor del cuartel y uno más), a la madera: supuesto mío.
#  - Castillos 49 (36 aldeanos + 3 hombres de armas + 10 arqueros) y reparto (16/12/8): de la última fila y la
#    referencia "Castle click with 10 archers" de Cicero.
#  - Paso a huscarles en Castillos y orden de mejoras: criterio propio a partir de los consejos de la civilización.
