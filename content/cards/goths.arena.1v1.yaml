# Godos · Arena · 1v1 — T40. Aprobada por el mantenedor.
# Plan: Fast Castle con castillo y Anarquía → oleada de huscarles desde 4-5 cuarteles con arietes; en Imperial,
#       Movilización y huscarles de élite.
#   No hay guía publicada con planes de Godos por mapa. Se combinan: Cicero, "27+2 FC Boom" (Fast Castle
#   genérico, recomendado para mapas cerrados), aoedb.net "Huskarl Flood" (Fast Castle con poco ejército,
#   Anarquía enseguida, 4-5 cuarteles, Movilización en Imperial) y aoe2-guide (Arena: el control de reliquias
#   es central; las murallas de piedra impiden atacar temprano).
# Mecánicas verificadas contra los datos del parche 188329: Telar instantáneo, cazadores +15 de carga,
# infantería -25/30 % en Castillos/Imperial, +2/+3 de ataque de la infantería contra edificios, Anarquía
# (Castillos), Movilización (Imperial: cuarteles +100 %), Ariete cubierto y Huscarle de élite disponibles;
# sin Ariete de asedio.
# Notas de revisión:
#  - Feudal 27 y Castillos 29: del título del build de Cicero. Repartos (14/10/3 y 14/8/3/4): sumas de la
#    tabla de "28+2 FC Knights" del mismo sitio; la piedra para el castillo (4 aldeanos) es supuesto mío.
#  - Arietes en el ataque, tamaño del ataque y orden de mejoras: criterio propio.
