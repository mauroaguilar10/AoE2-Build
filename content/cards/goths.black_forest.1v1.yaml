# Godos · Selva Negra · 1v1 — T40. Aprobada por el mantenedor.
# Plan: amurallar con doble empalizada, Fast Castle con boom de centros urbanos → castillo, Anarquía y
#       cuarteles; en Imperial, Movilización y oleada de huscarles de élite con cañones de asedio.
#   No hay guía publicada con planes de Godos por mapa. Se combinan: Sitaux (amurallar después de los dos
#   jabalíes, doble empalizada sin puerta), aoe2-guide (Selva Negra: amurallar las aberturas, boom y apuntar a
#   Imperial hacia el minuto 30-32; asedio pesado para atacar), Cicero "27+2 FC Boom" y aoedb.net "Huskarl Flood".
# Mecánicas verificadas contra los datos del parche 188329: sin murallas de piedra, muralla fortificada ni torre
# de guardia (solo empalizada); sin Onagro de asedio (no pueden talar el bosque como otras civilizaciones);
# Anarquía (Castillos), Movilización (Imperial), +10 de población en Imperial, +3 de ataque de la infantería
# contra edificios en Imperial; Cañón de asedio y Huscarle de élite disponibles.
# Notas de revisión:
#  - Poblaciones (27 y 29) y repartos: como en Godos · Arena.
#  - Atacar en Imperial y la composición del ataque: criterio propio a partir de aoe2-guide y aoedb.
civ: Goths
map: black_forest
role: 1v1
sources:
  - title: "Sitaux — Black Forest (amurallar después de los jabalíes con doble empalizada, sin puerta)"
    url: "https://sitaux.com/black-forest/"
  - title: "aoe2-guide — Black Forest (amurallar las aberturas, boom, Imperial hacia el minuto 30-32, asedio pesado)"
    url: "https://aoe2-guide.pages.dev/en/maps/black-forest"
  - title: "Build Order Reference (Cicero) — 27+2 FC Boom: Fast Castle para mapas cerrados"
    url: "https://johsaoe2debuildorderreference.site44.com/27+2-fc-boom.html"
  - title: "aoedb.net — Goths: Huskarl Flood (Anarquía, varios cuarteles, Movilización en Imperial)"
    url: "https://aoedb.net/aoe2/civilizations/goths/"
